name: Weekly tool link check

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: python3 -I scripts/link-report.py report.md
      - name: Open or update the report issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Weekly link check: tools that need a look"
          num=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')
          if [ -n "$num" ]; then
            gh issue edit "$num" --body-file report.md
            gh issue comment "$num" --body "Updated $(date -u +%Y-%m-%d): $(head -1 report.md)"
          else
            gh issue create --title "$title" --body-file report.md
          fi
